[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isofate"
version = "0.1.2"
requires-python = ">=3.11"

dependencies = [
 "numpy>=2.3",
 "scipy>=1.16.1",
 "matplotlib>=3.10.0",
 "atmodeller @ git+https://github.com/ExPlanetology/atmodeller.git@djbower/v2preview",
 "optimistix>=0.1.0",
 "emcee",
 "corner"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["isofate*"]

[tool.setuptools.package-data]
isofate = ["data/**/*"]

