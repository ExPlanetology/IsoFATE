[project]
name = "isofate"
version = "0.2.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    {name = "Collin Cherubim", email = "collinc@uchicago.edu"},
    {name = "Dan J Bower", email = "dbower@eaps.ethz.ch"},
]

dependencies = [
    # JAX pinned for Intel macOS
    "jax==0.4.38; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # JAX requirements for all other platforms
    "jax>0.4.38,!=0.7.0,!=0.7.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # SciPy and NumPy minimum requirements for jax 0.4.31
    "numpy>=1.24",
    "scipy>=1.10.0",
    "molmass>=2026.1.8",
    "matplotlib>=3.10.0",
    "atmodeller @ git+https://github.com/ExPlanetology/atmodeller.git@djbower/v2preview",
    "optimistix>=0.1.0",
    "equinox>=0.13.8",
    "emcee",
    "corner",
    "diffrax>=0.7.2",
]

[project.optional-dependencies]
docs = [
    "sphinx-rtd-theme>=3.0.2",
    "sphinx>=8.2.3",
    "sphinxcontrib-bibtex>=2.6.5",
    "setuptools>=80.9.0",
    "myst-parser>=5.0.0",
    "doc8>=2.0.0",
    "nbsphinx>=0.9.6",
    "pypandoc>=1.15",
    "nbsphinx-link>=1.3.1",
]

[dependency-groups]
dev = [
    "beartype>=0.22.0,<0.23.0",
    "jaxtyping>=0.3.2,<0.4.0",
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
    "pytest-beartype>=0.2.0,<0.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["isofate*"]

[tool.setuptools.package-data]
isofate = ["data/**/*"]

#[tool.setuptools]
#include-package-data = true

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"
